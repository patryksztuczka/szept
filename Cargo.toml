[package]
name = "szept"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "szept"
path = "src/main.rs"

[features]
# Compile GPUI's Metal shaders at runtime instead of at build time. Use this
# when full Xcode (with the Metal toolchain) is not installed. Release bundles
# should be built without it.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-symbols = { version = "0.6.1", default-features = false, features = ["component", "cache"] }
libloading = "0.9.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
raw-window-handle = "0.6.2"

[profile.release]
lto = "thin"
codegen-units = 1
